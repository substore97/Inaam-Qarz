<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inaam PC Monitor</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { --bg:#0e1320; --card:#18203a; --line:#263156; --text:#f1f4fb; --dim:#9aa6c4;
          --blue:#4f8cff; --green:#34d399; --orange:#fbbf24; --red:#f87171; --purple:#a78bfa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Segoe UI", system-ui, "Noto Sans Arabic", sans-serif; }
  [dir=rtl] body { font-size:16px; line-height:1.9; }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px 8px; }
  h1 { font-size:22px; margin:0; flex:1; }
  .sub { color:var(--dim); font-size:13px; font-weight:400; margin-inline-start:10px; }
  button { font:inherit; color:var(--text); background:var(--card); border:0; border-radius:20px; padding:8px 16px; cursor:pointer; }
  button:hover { filter:brightness(1.2); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  nav { display:flex; gap:8px; padding:6px 24px 14px; flex-wrap:wrap; }
  nav button.on { background:var(--blue); color:var(--bg); font-weight:700; }
  main { padding:0 24px 32px; max-width:1200px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin-bottom:12px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; }
  .card h2 { margin:0 0 4px; font-size:13px; font-weight:700; }
  .big { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .bar { height:8px; border-radius:4px; background:#ffffff22; overflow:hidden; margin:8px 0; }
  .bar i { display:block; height:100%; border-radius:4px; }
  .kv { display:flex; justify-content:space-between; gap:12px; color:var(--dim); font-size:14px; padding:2px 0; }
  .kv b { color:var(--text); font-weight:400; text-align:end; }
  .issue { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .issue:first-of-type { border-top:0; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .issue div { flex:1; }
  .issue small { display:block; color:var(--dim); }
  .act { background:var(--red); color:var(--bg); font-weight:700; border-radius:10px; padding:6px 12px; white-space:nowrap; }
  .go { background:var(--green); color:var(--bg); font-weight:700; border-radius:12px; padding:10px 20px; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:8px 10px; text-align:start; white-space:nowrap; }
  th { color:var(--dim); font-size:13px; font-weight:600; cursor:pointer; user-select:none; border-bottom:1px solid var(--line); }
  th.sorted { color:var(--blue); }
  td.num, th.num { text-align:end; }
  tbody tr { border-bottom:1px solid #26315660; }
  tbody tr:hover { background:#ffffff08; }
  td.name { max-width:320px; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .tag { font-size:11px; font-weight:700; border-radius:8px; padding:1px 7px; margin-inline-start:6px; background:var(--red); color:var(--bg); }
  .cnt { color:var(--dim); font-weight:400; margin-inline-start:4px; }
  .hot { color:var(--red); font-weight:700; } .warm { color:var(--orange); }
  input[type=search] { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 14px; width:260px; max-width:100%; margin-bottom:12px; }
  .note { color:var(--dim); font-size:13px; }
  .clean { display:flex; align-items:flex-start; gap:14px; padding:12px 0; border-top:1px solid var(--line); }
  .clean label { cursor:pointer; } .clean input { margin-top:3px; cursor:pointer; }
  details { margin-top:6px; } summary { cursor:pointer; color:var(--blue); font-size:13px; }
  .path { direction:ltr; unicode-bidi:plaintext; overflow-wrap:anywhere; font-size:12px; }
  .clean > div { min-width:0; }
  .clean:first-of-type { border-top:0; }
  .clean input { width:20px; height:20px; accent-color:var(--green); flex:none; }
  .clean div { flex:1; } .clean small { display:block; color:var(--dim); }
  .clean b { font-variant-numeric:tabular-nums; }
  a { color:var(--blue); }
  .big, td.num, .kv b, .clean b { unicode-bidi:plaintext; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:12px; font-weight:600; z-index:5; }
  #overlay { position:fixed; inset:0; background:#0e1320f2; z-index:9; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px; }
  #overlay .count { font-size:96px; font-weight:700; color:var(--red); line-height:1; }
  .hide, #overlay.hide, #toast.hide { display:none; }
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="" width="40" height="40" style="border-radius:22%">
  <h1><span id="title"></span><span class="sub" id="hostline"></span></h1>
  <button id="lang"></button>
  <button id="power" class="act" style="padding:8px 16px;border-radius:20px"></button>
</header>
<nav id="tabs"></nav>
<div id="toast" class="hide"></div>
<div id="overlay" class="hide"></div>
<main>
  <section id="t0"></section>
  <section id="t1" class="hide">
    <input type="search" id="q">
    <div class="card tablewrap"><table><thead id="ph"></thead><tbody id="pb"></tbody></table></div>
    <p class="note" id="pnote"></p>
  </section>
  <section id="t2" class="hide"></section>
  <section id="t3" class="hide"></section>
  <section id="t4" class="hide"></section>
</main>
<script>
const token = new URLSearchParams(location.search).get('t') || '';
const api = (p, body) => fetch(p + '?t=' + token, body === undefined ? {} : {method:'POST', body:JSON.stringify(body)}).then(r => r.json());
let P = null, printMsg = '', printBusy = false;
let ur = false, tab = 0, S = null, sortKey = 'cpu', query = '', scan = null, cleanMsg = '', busy = false;
try { ur = localStorage.getItem('ur') === '1'; } catch (e) {}
const checked = {};
const tr = (en, u) => ur ? u : en;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function size(b) {
  if (b < 1024) return Math.round(b) + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < 3);
  return (b < 10 ? b.toFixed(1) : Math.round(b)) + ' ' + u[i];
}
const rate = b => b < 1 ? '—' : size(b) + '/s';
const pct = v => (v < 10 ? v.toFixed(1) : Math.round(v)) + '%';
function uptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + tr('d ', ' دن ') : '') + h + tr('h ', ' گھنٹے ') + m + tr('m', ' منٹ');
}
const bar = (f, color) => `<div class="bar"><i style="width:${Math.min(100, Math.max(0, f * 100))}%;background:${color}"></i></div>`;
const level = f => f > 0.9 ? 'var(--red)' : f > 0.75 ? 'var(--orange)' : 'var(--green)';
const topOf = key => S.procs.reduce((a, p) => (!a || key(p) > key(a)) ? p : a, null);
const endBtn = p => p.protected ? '' : `<button class="act" data-kill="${esc(p.name)}">${tr('End task', 'بند کریں')}</button>`;

function shell() {
  document.documentElement.dir = ur ? 'rtl' : 'ltr';
  document.documentElement.lang = ur ? 'ur' : 'en';
  title.textContent = tr('Inaam PC Monitor', 'انعام پی سی مانیٹر');
  lang.textContent = ur ? 'English' : 'اردو';
  power.textContent = '⏻ ' + tr('Shut down PC', 'کمپیوٹر بند کریں');
  power.title = tr('Double-click to shut down the computer', 'کمپیوٹر بند کرنے کے لیے ڈبل کلک کریں');
  const names = [tr('Overview', 'خلاصہ'), tr('Programs', 'پروگرام'), tr('Network', 'نیٹ ورک / ڈیٹا'), tr('Cleaner', 'صفائی'), tr('Printer', 'پرنٹر')];
  tabs.innerHTML = names.map((n, i) => `<button data-tab="${i}" class="${i === tab ? 'on' : ''}">${n}</button>`).join('');
  for (let i = 0; i < 5; i++) document.getElementById('t' + i).classList.toggle('hide', i !== tab);
  q.placeholder = tr('Search program…', 'پروگرام تلاش کریں…');
  render();
}

function issues() {
  const out = [];
  for (const h of S.hung) {
    const p = S.procs.find(x => x.name === h.name);
    out.push({c:'var(--red)', t: tr(`${h.name} is not responding (hung)`, `${h.name} جواب نہیں دے رہا (ہینگ ہے)`), s: h.title, p});
  }
  const mem = S.memUsed / S.memTotal;
  if (S.cpu > 85) { const p = topOf(x => x.cpu);
    out.push({c:'var(--red)', t: tr(`Processor is overloaded (${pct(S.cpu)})`, `پروسیسر پر بہت بوجھ ہے (${pct(S.cpu)})`),
      s: p && tr(`${p.name} is using the most: ${pct(p.cpu)}`, `سب سے زیادہ ${p.name} استعمال کر رہا ہے: ${pct(p.cpu)}`), p}); }
  if (mem > 0.85) { const p = topOf(x => x.mem);
    out.push({c: mem > 0.93 ? 'var(--red)' : 'var(--orange)', t: tr(`Memory (RAM) is almost full (${pct(mem * 100)})`, `ریم تقریباً بھر چکی ہے (${pct(mem * 100)})`),
      s: p && tr(`${p.name} is using the most: ${size(p.mem)}`, `سب سے زیادہ ${p.name} استعمال کر رہا ہے: ${size(p.mem)}`), p}); }
  if (S.diskR + S.diskW > 40e6) { const p = topOf(x => x.diskR + x.diskW);
    out.push({c:'var(--orange)', t: tr(`Disk is very busy (${rate(S.diskR + S.diskW)})`, `ڈسک بہت مصروف ہے (${rate(S.diskR + S.diskW)})`),
      s: p && tr(`${p.name} is reading/writing the most`, `سب سے زیادہ ${p.name} پڑھ/لکھ رہا ہے`), p}); }
  for (const d of S.disks || []) if (d.total > 2e9 && d.used / d.total > 0.9)
    out.push({c:'var(--orange)', t: tr(`Drive ${d.path} is almost full`, `ڈرائیو ${d.path} تقریباً بھر چکی ہے`),
      s: tr(`Only ${size(d.total - d.used)} free. Open the Cleaner tab.`, `صرف ${size(d.total - d.used)} خالی ہے۔ "صفائی" ٹیب کھولیں۔`)});
  return out;
}

function overview() {
  const mem = S.memUsed / S.memTotal, is = issues();
  const tc = topOf(x => x.cpu), tm = topOf(x => x.mem), tn = topOf(x => x.net);
  let h = `<div class="card"><h2 style="color:${is.length ? 'var(--red)' : 'var(--green)'}">${tr('What is slowing this PC?', 'کمپیوٹر کو کیا چیز سست کر رہی ہے؟')}</h2>`;
  if (!is.length) h += `<div class="issue"><span class="dot" style="background:var(--green)"></span><div>${tr('Nothing right now — the PC is running normally.', 'ابھی کچھ نہیں — کمپیوٹر نارمل چل رہا ہے۔')}</div></div>`;
  for (const i of is) h += `<div class="issue"><span class="dot" style="background:${i.c}"></span><div>${esc(i.t)}<small>${esc(i.s || '')}</small></div>${i.p ? endBtn(i.p) : ''}</div>`;
  h += `</div><div class="grid">
    <div class="card"><h2 style="color:var(--blue)">${tr('Processor (CPU)', 'پروسیسر (CPU)')}</h2><div class="big">${pct(S.cpu)}</div>${bar(S.cpu / 100, level(S.cpu / 100))}
      <div class="kv">${tr('Top program', 'سب سے زیادہ')}<b>${tc ? esc(tc.name) + ' • ' + pct(tc.cpu) : '—'}</b></div></div>
    <div class="card"><h2 style="color:var(--purple)">${tr('Memory (RAM)', 'ریم')}</h2><div class="big">${size(S.memUsed)} / ${size(S.memTotal)}</div>${bar(mem, level(mem))}
      <div class="kv">${tr('Top program', 'سب سے زیادہ')}<b>${tm ? esc(tm.name) + ' • ' + size(tm.mem) : '—'}</b></div></div>
    <div class="card"><h2 style="color:var(--orange)">${tr('Internet speed now', 'اس وقت انٹرنیٹ کی رفتار')}</h2><div class="big">↓ ${rate(S.netDown)}</div>
      <div class="kv">${tr('Upload', 'اپ لوڈ')}<b>↑ ${rate(S.netUp)}</b></div>
      <div class="kv">${tr('Top program', 'سب سے زیادہ')}<b>${tn && tn.net >= 1 ? esc(tn.name) + ' • ' + rate(tn.net) : '—'}</b></div></div>
    <div class="card"><h2 style="color:var(--green)">${tr('Disk activity', 'ڈسک کی سرگرمی')}</h2><div class="big">${rate(S.diskR + S.diskW)}</div>
      <div class="kv">${tr('Reading', 'پڑھنا')}<b>${rate(S.diskR)}</b></div><div class="kv">${tr('Writing', 'لکھنا')}<b>${rate(S.diskW)}</b></div></div>
  </div><div class="card"><h2 style="color:var(--green)">${tr('Drives', 'ڈرائیوز')}</h2>`;
  for (const d of S.disks || []) h += `<div class="kv" style="margin-top:8px"><span style="color:var(--text)">${esc(d.path)}</span><b>${size(d.used)} / ${size(d.total)} • ${tr('free', 'خالی')} ${size(d.total - d.used)}</b></div>${bar(d.used / d.total, level(d.used / d.total))}`;
  h += `</div>`;
  h += adminBar();
  t0.innerHTML = h;
}

const cols = () => [
  ['name', tr('Program', 'پروگرام'), p => 0],
  ['cpu', 'CPU', p => p.cpu], ['mem', tr('RAM', 'ریم'), p => p.mem],
  ['disk', tr('Disk', 'ڈسک'), p => p.diskR + p.diskW], ['net', tr('Network', 'نیٹ ورک'), p => p.net],
];

function programs() {
  const c = cols();
  ph.innerHTML = '<tr>' + c.map((x, i) => `<th data-sort="${x[0]}" class="${i ? 'num' : ''} ${sortKey === x[0] ? 'sorted' : ''}">${x[1]}${sortKey === x[0] ? ' ▾' : ''}</th>`).join('') + '<th></th></tr>';
  const key = c.find(x => x[0] === sortKey)[2];
  let rows = S.procs.filter(p => !query || p.name.toLowerCase().includes(query));
  rows = sortKey === 'name' ? rows.sort((a, b) => a.name.localeCompare(b.name)) : rows.sort((a, b) => key(b) - key(a));
  pb.innerHTML = rows.slice(0, 80).map(p => `<tr>
    <td class="name" title="${esc(p.name)}">${esc(p.name)}${p.pids.length > 1 ? `<span class="cnt">×${p.pids.length}</span>` : ''}${p.hung ? `<span class="tag">${tr('Not responding', 'ہینگ')}</span>` : ''}</td>
    <td class="num ${p.cpu > 50 ? 'hot' : p.cpu > 20 ? 'warm' : ''}">${pct(p.cpu)}</td>
    <td class="num ${p.mem / S.memTotal > 0.3 ? 'hot' : p.mem / S.memTotal > 0.12 ? 'warm' : ''}">${size(p.mem)}</td>
    <td class="num">${rate(p.diskR + p.diskW)}</td><td class="num">${rate(p.net)}</td>
    <td class="num">${endBtn(p)}</td></tr>`).join('');
  pnote.textContent = tr('Click a column name to sort. "End task" closes the program immediately — save your work in it first. Windows system programs cannot be ended from here.',
    'ترتیب بدلنے کے لیے کالم کے نام پر کلک کریں۔ "بند کریں" پروگرام کو فوراً بند کر دیتا ہے — پہلے اس میں اپنا کام محفوظ کر لیں۔ ونڈوز کے سسٹم پروگرام یہاں سے بند نہیں ہو سکتے۔');
}

function network() {
  const rows = S.procs.filter(p => p.conns > 0 || p.net >= 1 || p.netTotal > 0).sort((a, b) => b.net - a.net || b.netTotal - a.netTotal);
  const max = Math.max(1, ...rows.map(p => p.netTotal));
  t2.innerHTML = `<div class="grid">
    <div class="card"><h2 style="color:var(--green)">${tr('Download speed', 'ڈاؤن لوڈ کی رفتار')}</h2><div class="big">↓ ${rate(S.netDown)}</div></div>
    <div class="card"><h2 style="color:var(--blue)">${tr('Upload speed', 'اپ لوڈ کی رفتار')}</h2><div class="big">↑ ${rate(S.netUp)}</div></div>
    <div class="card"><h2 style="color:var(--orange)">${tr('Used since Inaam PC Monitor opened', 'Inaam PC Monitor کھلنے کے بعد استعمال')}</h2><div class="big">${size(S.sessDown + S.sessUp)}</div>
      <div class="kv">↓ ${size(S.sessDown)}<b>↑ ${size(S.sessUp)}</b></div></div></div>
    <div class="card tablewrap"><table><thead><tr><th>${tr('Program', 'پروگرام')}</th><th class="num">${tr('Speed now', 'اس وقت رفتار')}</th>
      <th class="num">${tr('Total since it started', 'شروع ہونے سے اب تک')}</th><th class="num">${tr('Connections', 'کنکشن')}</th><th></th></tr></thead><tbody>` +
    rows.slice(0, 60).map(p => `<tr><td class="name">${esc(p.name)}${p.pids.length > 1 ? `<span class="cnt">×${p.pids.length}</span>` : ''}${bar(p.netTotal / max, 'var(--orange)')}</td>
      <td class="num ${p.net > 1e6 ? 'hot' : p.net > 1e5 ? 'warm' : ''}">${rate(p.net)}</td><td class="num">${size(p.netTotal)}</td><td class="num">${p.conns}</td><td class="num">${endBtn(p)}</td></tr>`).join('') +
    (rows.length ? '' : `<tr><td colspan="5" class="note">${tr('No program is using the internet right now.', 'اس وقت کوئی پروگرام انٹرنیٹ استعمال نہیں کر رہا۔')}</td></tr>`) +
    `</tbody></table></div><p class="note">${tr(
      'The speeds at the top are exact. Per-program numbers are estimates (Windows only gives exact per-program data to its own tools). For the exact 30-day total per app, open ',
      'اوپر والی رفتار بالکل درست ہے۔ ہر پروگرام کے اعداد اندازہ ہیں (ونڈوز ہر پروگرام کا درست ڈیٹا صرف اپنے ٹولز کو دیتا ہے)۔ ہر ایپ کا 30 دن کا درست حساب دیکھنے کے لیے کھولیں: ')}
      <a href="ms-settings:datausage">${tr('Windows Settings → Data usage', 'Windows Settings ← Data usage')}</a>.</p>`;
}

const cleanNames = () => ({
  temp: [tr('Temporary files (%tmp%)', 'عارضی فائلیں (%tmp%)'), tr('Leftovers from programs and installers. Files from the last 2 hours and files in use are kept.', 'پروگراموں اور انسٹالرز کی بچی ہوئی فائلیں۔ پچھلے 2 گھنٹوں کی اور استعمال میں موجود فائلیں رہنے دی جاتی ہیں۔')],
  wintemp: [tr('Windows temporary files', 'ونڈوز کی عارضی فائلیں'), tr('C:\\Windows\\Temp, older than 1 day.', 'C:\\Windows\\Temp، 1 دن سے پرانی۔'), 1],
  browser: [tr('Browser cache', 'براؤزر کا کیش'), tr('Chrome, Edge, Brave, Opera, Vivaldi, Firefox. Passwords, history, bookmarks, cookies and logins are NOT touched.', 'کروم، ایج، بریو، اوپیرا، ویوالڈی، فائر فاکس۔ پاس ورڈ، ہسٹری، بک مارکس، کوکیز اور لاگ اِن کو نہیں چھیڑا جاتا۔')],
  apps: [tr('App cache', 'ایپس کا کیش'), tr('Cache of programs like Teams, Discord, Slack, WhatsApp, VS Code and Steam. Chats, logins and settings stay.', 'ٹیمز، ڈسکارڈ، سلیک، واٹس ایپ، وی ایس کوڈ اور اسٹیم جیسے پروگراموں کا کیش۔ چیٹس، لاگ اِن اور سیٹنگز محفوظ رہتی ہیں۔')],
  storetemp: [tr('Microsoft Store app temp files', 'مائیکروسافٹ اسٹور ایپس کی عارضی فائلیں'), tr('Only the temporary folders of Store apps, older than 2 hours.', 'صرف اسٹور ایپس کے عارضی فولڈر، 2 گھنٹے سے پرانے۔')],
  thumbs: [tr('Thumbnail and icon cache', 'تھمب نیل اور آئیکن کیش'), tr('Small preview pictures; Windows rebuilds them.', 'چھوٹی پیش نظارہ تصویریں؛ ونڈوز انہیں دوبارہ بنا لیتا ہے۔')],
  shader: [tr('Graphics cache', 'گرافکس کیش'), tr('DirectX, NVIDIA, AMD and Intel shader caches; rebuilt automatically.', 'ڈائریکٹ ایکس، این ویڈیا، اے ایم ڈی اور انٹیل کے شیڈر کیش؛ خود دوبارہ بن جاتے ہیں۔')],
  crash: [tr('Crash reports', 'کریش رپورٹس'), tr('Error reports and dumps left by crashed programs.', 'کریش ہونے والے پروگراموں کی چھوڑی ہوئی رپورٹس۔')],
  dumps: [tr('System crash dumps', 'سسٹم کریش ڈمپس'), tr('Memory dumps from blue-screen crashes (MEMORY.DMP, Minidump). Often very large.', 'نیلی اسکرین والے کریش کے میموری ڈمپ (MEMORY.DMP، Minidump)۔ اکثر بہت بڑے ہوتے ہیں۔'), 1],
  logs: [tr('Old Windows log files', 'ونڈوز کی پرانی لاگ فائلیں'), tr('Update and setup logs in C:\\Windows\\Logs, older than 7 days.', 'C:\\Windows\\Logs میں اپڈیٹ اور سیٹ اپ کے لاگ، 7 دن سے پرانے۔'), 1],
  update: [tr('Old Windows Update downloads', 'ونڈوز اپڈیٹ کی پرانی ڈاؤن لوڈز'), tr('Update files older than 7 days; Windows downloads them again if it ever needs them.', '7 دن سے پرانی اپڈیٹ فائلیں؛ ضرورت پڑے تو ونڈوز انہیں دوبارہ ڈاؤن لوڈ کر لیتا ہے۔'), 1],
  delivery: [tr('Update sharing cache', 'اپڈیٹ شیئرنگ کیش'), tr('Copies of updates kept to share with other PCs (Delivery Optimization).', 'دوسرے کمپیوٹرز کے ساتھ بانٹنے کے لیے رکھی گئی اپڈیٹس کی کاپیاں (Delivery Optimization)۔'), 1],
  prefetch: [tr('Prefetch files', 'پری فیچ فائلیں'), tr('Windows rebuilds them; programs may open a little slower the first time.', 'ونڈوز انہیں دوبارہ بنا لیتا ہے؛ پہلی بار پروگرام ذرا دیر سے کھل سکتے ہیں۔'), 1],
  recycle: [tr('Recycle Bin', 'ری سائیکل بن'), tr('Files you already deleted. Tick this only if you are sure you will not want them back.', 'وہ فائلیں جو آپ پہلے ہی حذف کر چکے ہیں۔ صرف تب ٹک کریں جب یقین ہو کہ یہ واپس نہیں چاہییں۔')],
});
const selectedBytes = () => (scan || []).reduce((a, r) => a + (checked[r.id] ? r.bytes : 0), 0);
const cleanLabel = () => busy ? tr('Cleaning…', 'صفائی جاری ہے…') : tr('Clean selected', 'منتخب صاف کریں') + ' • ' + size(selectedBytes());
const adminBar = () => (S && !S.admin) ? `<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
  <div style="flex:1;min-width:240px">${tr('Some Windows folders and system programs can only be seen and cleaned as administrator.', 'ونڈوز کے کچھ فولڈر اور سسٹم پروگرام صرف ایڈمنسٹریٹر کے طور پر دیکھے اور صاف کیے جا سکتے ہیں۔')}</div>
  <button class="go" id="elev" style="background:var(--blue)">${tr('Restart as administrator', 'ایڈمنسٹریٹر کے طور پر دوبارہ کھولیں')}</button></div>` : '';

function cleaner() {
  const n = cleanNames();
  for (const r of scan || []) if (checked[r.id] === undefined) checked[r.id] = false;
  let h = adminBar();
  if (!scan) h += `<div class="card"><h2 style="color:var(--green)">${tr('Safe clean-up', 'محفوظ صفائی')}</h2><p>${tr('Scanning the whole PC for junk…', 'پورے کمپیوٹر میں بیکار فائلیں تلاش ہو رہی ہیں…')}</p></div>`;
  else {
    const all = scan.reduce((a, r) => a + r.bytes, 0), files = scan.reduce((a, r) => a + r.files, 0);
    h += `<div class="card"><h2 style="color:var(--green)">${tr('Junk found on this PC', 'اس کمپیوٹر میں ملی بیکار فائلیں')}</h2>
      <div class="big">${size(all)}</div><div class="kv">${tr('Files', 'فائلیں')}<b>${files.toLocaleString('en')}</b></div>
      <p class="note">${tr('Only cache, temporary files, logs and crash reports are listed. Your documents, pictures, downloads, passwords, browser history, programs and their settings are never touched. Files that are in use are skipped.',
        'یہاں صرف کیش، عارضی فائلیں، لاگ اور کریش رپورٹس ہیں۔ آپ کے ڈاکومنٹس، تصویریں، ڈاؤن لوڈز، پاس ورڈ، براؤزر ہسٹری، پروگرام اور ان کی سیٹنگز کو کبھی نہیں چھیڑا جاتا۔ جو فائلیں استعمال میں ہوں وہ چھوڑ دی جاتی ہیں۔')}</p>
      <div style="display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap">
      <button class="go" id="doclean" ${busy ? 'disabled' : ''}>${cleanLabel()}</button>
      <button id="rescan">${tr('Scan again', 'دوبارہ اسکین')}</button><span>${esc(cleanMsg)}</span></div>
      <p class="note">${tr('Nothing is selected by default. Tick the items you want to clean.', 'پہلے سے کچھ منتخب نہیں ہوتا۔ جو صاف کرنا ہو اس پر خود ٹک لگائیں۔')}</p></div><div class="card">`;
    for (const r of scan) {
      const nm = n[r.id] || [r.id, ''];
      const needAdmin = nm[2] && !S.admin ? ` <span class="tag" style="background:var(--orange)">${tr('administrator', 'ایڈمنسٹریٹر')}</span>` : '';
      const places = (r.places || []).map(p => `<div class="kv"><span class="path">${esc(p.path)}</span><b>${size(p.bytes)} • ${p.files.toLocaleString('en')}</b></div>`).join('');
      h += `<div class="clean"><input type="checkbox" id="c_${r.id}" data-clean="${r.id}" ${checked[r.id] ? 'checked' : ''}>
        <div><label for="c_${r.id}">${nm[0]}${needAdmin}</label><small>${nm[1]}</small>
        ${places ? `<details><summary>${tr('Show where', 'دکھائیں کہاں ہیں')} (${r.places.length})</summary>${places}</details>` : ''}</div>
        <b style="${r.bytes ? '' : 'color:var(--dim)'}">${size(r.bytes)}</b></div>`;
    }
    h += `</div>`;
  }
  t3.innerHTML = h + `<p class="note">${tr('For more space from browser and app caches, close those programs first and then clean.', 'براؤزر اور ایپس کے کیش سے زیادہ جگہ خالی کرنے کے لیے پہلے وہ پروگرام بند کریں، پھر صاف کریں۔')}</p>`;
}

function printer() {
  let h = adminBar() + `<div class="card"><h2 style="color:var(--blue)">${tr('Print queue', 'پرنٹ کی قطار')}</h2>`;
  if (!P) h += `<p>${tr('Checking printers…', 'پرنٹر چیک ہو رہے ہیں…')}</p>`;
  else if (!P.jobs.length) h += `<div class="issue"><span class="dot" style="background:var(--green)"></span><div>${tr('No print jobs are waiting.', 'کوئی پرنٹ جاب انتظار میں نہیں ہے۔')}</div></div>`;
  else for (const j of P.jobs) {
    const bad = /error|offline|paper|blocked|intervention|deleting/i.test(j.status);
    h += `<div class="issue"><span class="dot" style="background:${bad ? 'var(--red)' : 'var(--orange)'}"></span>
      <div>${esc(j.doc || '—')}<small>${esc(j.printer)} • ${esc(j.status)} • ${size(j.size)}${j.user ? ' • ' + esc(j.user) : ''}</small></div>
      <button class="act" data-pjob="${j.id}" data-printer="${esc(j.printer)}">${tr('Delete', 'حذف کریں')}</button></div>`;
  }
  h += `<div style="display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap">
    <button class="act" id="pclear" style="padding:10px 20px" ${printBusy ? 'disabled' : ''}>${printBusy ? tr('Clearing…', 'صاف ہو رہا ہے…') : tr('Delete ALL print jobs now', 'تمام پرنٹ جابز ابھی حذف کریں')}</button>
    <span>${esc(printMsg)}</span></div></div>
  <p class="note">${tr('Only the waiting print jobs are removed; your documents and files stay exactly as they are. If a job is badly stuck, run Inaam PC Monitor with right-click → "Run as administrator": the button then restarts the Windows print service and empties its queue.',
    'صرف انتظار میں موجود پرنٹ جابز ہٹتی ہیں؛ آپ کے ڈاکومنٹس اور فائلیں جوں کی توں رہتی ہیں۔ اگر کوئی جاب بری طرح اٹکی ہو تو Inaam PC Monitor کو رائٹ کلک ← "Run as administrator" سے چلائیں: پھر یہ بٹن ونڈوز کی پرنٹ سروس دوبارہ چلا کر اس کی قطار خالی کر دیتا ہے۔')}</p>`;
  t4.innerHTML = h;
}
const loadPrint = () => api('/api/print').then(r => { P = r; P.jobs = P.jobs || []; if (tab === 4 && !printBusy) printer(); }).catch(() => {});

function render() {
  if (!S) return;
  hostline.textContent = `${S.host} • ${S.os} • ${tr('on for', 'چلتے ہوئے')} ${uptime(S.uptime)}`;
  [overview, programs, network, cleaner, printer][tab]();
}

function doScan() { scan = null; if (tab === 3) cleaner(); api('/api/clean/scan').then(r => { scan = r; if (tab === 3) cleaner(); }); }

let toastTimer = 0, shutTimer = 0;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.remove('hide');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hide'), 3000);
}
function startShutdown() {
  let n = 5;
  const show = () => overlay.innerHTML = `<div class="big">${tr('The computer will shut down in', 'کمپیوٹر بند ہونے والا ہے')}</div><div class="count">${n}</div>
    <div class="note" style="max-width:520px">${tr('If a program has unsaved work, Windows will stop and ask you first.', 'اگر کسی پروگرام میں کام محفوظ نہیں تو ونڈوز رک کر پہلے آپ سے پوچھے گا۔')}</div>
    <button class="go" id="shutcancel" style="font-size:18px;padding:12px 36px">${tr('Cancel', 'منسوخ کریں')}</button>`;
  clearInterval(shutTimer); show(); overlay.classList.remove('hide');
  shutTimer = setInterval(() => {
    if (--n > 0) return show();
    clearInterval(shutTimer);
    overlay.innerHTML = `<div class="big">${tr('Shutting down…', 'کمپیوٹر بند ہو رہا ہے…')}</div>`;
    api('/api/shutdown', {}).then(r => { if (!r.ok) throw 0; }).catch(() => {
      overlay.classList.add('hide'); toast(tr('Windows did not accept the shutdown request.', 'ونڈوز نے بند کرنے کی درخواست قبول نہیں کی۔')); });
  }, 1000);
}
power.addEventListener('dblclick', startShutdown);

document.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'power') { if (e.detail === 1) toast(tr('Double-click to shut down the computer.', 'کمپیوٹر بند کرنے کے لیے ڈبل کلک کریں۔')); return; }
  if (t.id === 'shutcancel') { clearInterval(shutTimer); overlay.classList.add('hide'); return; }
  if (t.dataset.tab !== undefined) { tab = +t.dataset.tab; shell(); if (tab === 3 && !scan) doScan(); if (tab === 4) loadPrint(); }
  else if (t.dataset.sort) { sortKey = t.dataset.sort; programs(); }
  else if (t.dataset.kill) {
    const name = t.dataset.kill;
    if (confirm(tr(`End "${name}" now?\n\nAnything not saved inside this program will be lost.`, `"${name}" کو ابھی بند کریں؟\n\nاس پروگرام میں جو کام محفوظ نہیں کیا گیا وہ ضائع ہو جائے گا۔`)))
      api('/api/kill', {name}).then(r => { if (!r.killed) alert(tr('Could not end it. Try "Run as administrator".', 'بند نہیں ہو سکا۔ "Run as administrator" آزمائیں۔')); });
  }
  else if (t.dataset.pjob) api('/api/print/delete', {printer: t.dataset.printer, id: +t.dataset.pjob}).then(r => {
    printMsg = r.ok ? tr('Job deleted.', 'جاب حذف ہو گئی۔') : tr('Could not delete it. Use "Delete ALL" as administrator.', 'حذف نہیں ہو سکی۔ ایڈمنسٹریٹر کے طور پر "تمام حذف کریں" استعمال کریں۔');
    loadPrint(); })
  else if (t.id === 'pclear') {
    printBusy = true; printMsg = ''; printer();
    api('/api/print/clear', {}).then(r => {
      printMsg = r.remaining === 0 ? tr('Print queue is empty now.', 'پرنٹ کی قطار اب خالی ہے۔')
        : r.admin ? tr(`${r.remaining} jobs still remain. Turn the printer off and on, then try again.`, `${r.remaining} جابز ابھی باقی ہیں۔ پرنٹر بند کر کے دوبارہ چلائیں، پھر کوشش کریں۔`)
        : tr(`${r.remaining} stuck jobs remain. Close Inaam PC Monitor and open it with "Run as administrator".`, `${r.remaining} اٹکی ہوئی جابز باقی ہیں۔ Inaam PC Monitor بند کر کے "Run as administrator" سے کھولیں۔`);
      printBusy = false; loadPrint(); printer();
    }).catch(() => { printBusy = false; printer(); });
  }
  else if (t.id === 'elev') api('/api/elevate', {}).then(r => {
    if (!r.ok) return alert(tr('Windows did not allow it. Right-click InaamPCMonitor.exe → "Run as administrator".', 'ونڈوز نے اجازت نہیں دی۔ InaamPCMonitor.exe پر رائٹ کلک ← "Run as administrator" کریں۔'));
    stopped = true;
    document.body.innerHTML = `<main style="padding:60px 24px"><div class="card"><div class="big">${tr('Inaam PC Monitor is reopening as administrator.', 'Inaam PC Monitor ایڈمنسٹریٹر کے طور پر دوبارہ کھل رہا ہے۔')}</div><p>${tr('You can close this window.', 'آپ یہ ونڈو بند کر سکتے ہیں۔')}</p></div></main>`;
    setTimeout(() => window.close(), 1500);
  })
  else if (t.id === 'rescan') { cleanMsg = ''; doScan(); }
  else if (t.id === 'doclean') {
    const ids = scan.filter(r => checked[r.id]).map(r => r.id);
    if (!ids.length) return toast(tr('Tick at least one item first.', 'پہلے کم از کم ایک چیز پر ٹک لگائیں۔'));
    busy = true; cleaner();
    api('/api/clean/run', {ids}).then(res => {
      const bytes = res.reduce((a, r) => a + r.bytes, 0), files = res.reduce((a, r) => a + r.files, 0), skipped = res.reduce((a, r) => a + r.skipped, 0);
      cleanMsg = tr(`Freed ${size(bytes)} (${files.toLocaleString('en')} files). ${skipped.toLocaleString('en')} in-use files were left alone.`, `${size(bytes)} جگہ خالی ہوئی (${files} فائلیں)۔ استعمال میں موجود ${skipped} فائلیں چھوڑ دی گئیں۔`);
      busy = false; doScan();
    }).catch(() => { busy = false; cleaner(); });
  }
});
document.addEventListener('change', e => { if (e.target.dataset.clean) { checked[e.target.dataset.clean] = e.target.checked; const b = document.getElementById('doclean'); if (b) b.textContent = cleanLabel(); } });
q.addEventListener('input', () => { query = q.value.trim().toLowerCase(); programs(); });
lang.addEventListener('click', () => { ur = !ur; try { localStorage.setItem('ur', ur ? '1' : '0'); } catch (e) {} shell(); });
addEventListener('pagehide', () => navigator.sendBeacon('/api/bye?t=' + token));

let stopped = false;
function poll() {
  if (stopped) return;
  api('/api/stats').then(s => {
    S = s; S.hung = S.hung || []; S.procs = S.procs || [];
    if (tab === 4) loadPrint();
    if (tab !== 3 && !(tab === 4 && printBusy)) render(); else hostline.textContent = `${S.host} • ${S.os}`;
  }).catch(() => {});
}
shell(); poll(); setInterval(poll, 2000);
</script>
</body>
</html>
